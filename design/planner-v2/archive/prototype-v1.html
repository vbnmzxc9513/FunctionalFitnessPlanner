function headerTop(back=null,label='返回'){document.getElementById('top').innerHTML=back?`<button class="back" onclick="go('${back}')">${I('back')}${label}</button><span class="demo">設計原型</span>`:`<div class="brand row"><span class="iconbox">${I('today')}</span>羽球功能性健身</div><span class="demo">設計原型</span>`;}
function entries(){return `<div class="choicecards"><button class="entry" onclick="state.mode='manual';go('03-dates-manual')"><span class="iconbox">${I('edit')}</span><div class="entrycopy"><h2>手動排課</h2><p>自己挑動作、組次與日期</p></div><span class="link">開始安排 ›</span></button><button class="entry" onclick="state.mode='auto';go('03b-dates-auto')"><span class="iconbox" style="background:var(--purplebg);color:var(--indigo)">${I('spark')}</span><div class="entrycopy"><h2>自動排課</h2><p>回答問題，依條件搭配</p></div><span class="link">開始互動 ›</span></button></div>`;}
function week(empty=false){headerTop();nav();return head('本週課表','先看這週安排，再選一天查看。')+`<div class="row between" style="margin-bottom:18px"><button class="quiet" onclick="toast('切換上一週')">‹</button><span class="strong">10/19 — 10/25</span><button class="quiet" onclick="toast('切換下一週')">›</button></div>`+(empty?`<section class="card empty"><div class="iconbox">${I('cal')}</div><h2>這週還沒有課表</h2><p>自己挑動作，或讓系統陪你安排。<br>排好後都能編輯與分享。</p></section><div class="gap">${entries()}</div><div class="card gap"><div class="row"><span class="iconbox">${I('share')}</span><div class="grow"><h3>朋友分享了課表？</h3><p class="small muted">開啟收到的連結，即可預覽與選日期匯入。</p></div></div></div>`:`${state.autoApplied?'<div class="success" style="margin-bottom:15px">✓ 已套用 3 天課表，可隨時編輯。</div>':''}${entries()}<div class="row between gap"><h2>這週的安排</h2><span class="small muted">2 肌力 · 3 恢復</span></div><div class="agenda gap-sm">${[['一',19,'全身肌力與穩定','肌力 · 已安排',38],['二',20,'八段舒緩拉伸','羽球日 · 恢復',12],['三',21,'肩胛與上肢肌力','肌力 · 已安排',35],['四',22,'八段舒緩拉伸','羽球日 · 恢復',12],['五',23,'球日舒緩拉伸','羽球日 · 恢復',12],['六',24,'休息','不另排體能',0],['日',25,'休息','不另排體能',0]].map((d,i)=>`<button class="agenda-row ${d[4]?'':'rest'}" onclick="state.day=${i===2?1:i===4?2:0};go('04-manual')"><span class="date">${d[0]}<b>${d[1]}</b></span><span class="grow"><h3>${d[2]}</h3><p>${d[3]}</p></span><span class="time">${d[4]?d[4]+' 分':'—'}</span>${I('arrow')}</button>`).join('')}</div><div class="row between gap"><button class="quiet" onclick="go('11-share')">${I('share')} 分享這週課表</button><button class="quiet" onclick="go('05-pick-strength')">${I('book')} 動作庫</button></div><button class="details-link" onclick="toast('展開目標與八區活動度安排')">查看本週重點與活動度安排 ${I('arrow')}</button>`);}
function dates(auto=false){headerTop('01-week');footer(auto?'下一步：訓練條件':'開始排 3 天課表',auto?'08-auto-goals':'04-manual','已選 3 天',auto?'10/19 — 10/25':'10/19、10/21、10/23');return progress(1,auto)+head('先選要排課的日期',auto?'先圈定期間，下一步再設定球日與體能可用日。':'點選想安排的日期，可以不連續。',auto?'自動排課':'手動排課')+(auto?`<div class="card"><div class="range"><div><label class="label">開始日期</label><input class="input" type="date" value="2026-10-19"></div><div><label class="label">結束日期</label><input class="input" type="date" value="2026-10-25"></div></div><div class="soft gap small">共 7 個日期 · 稍後會區分訓練、球日恢復與休息。</div></div>`:`<div class="card"><div class="row between"><button class="quiet" onclick="toast('切換月份')">‹</button><h2>2026 年 10 月</h2><button class="quiet" onclick="toast('切換月份')">›</button></div><div class="cal">${['一','二','三','四','五','六','日'].map(d=>`<span>${d}</span>`).join('')}${Array.from({length:35},(_,i)=>{const n=i-2;return n<1||n>31?'<span></span>':`<button class="${state.dates.has(n)?'selected':n<19?'faded':''}" ${n<19?'disabled':''} onclick="toggleDate(${n})">${n}</button>`}).join('')}</div><div class="dates-summary">✓ 已選 3 天：10/19、10/21、10/23</div></div><button class="quiet gap-sm" onclick="toast('一次選取這段期間的週一、三、五')">快速選取：每週一、三、五</button>`)+`<div class="soft gap small"><b>先排成草稿，再確認套用</b><p class="muted gap-sm">選日期不會立即更動既有課表。已有訓練紀錄的日期會保留。</p></div>`;}
function toggleDate(n){state.dates.has(n)?state.dates.delete(n):state.dates.add(n);render();}
function exrows(items){return items.map((e,i)=>`<div class="exercise"><span class="count">${i+1}</span><div class="grow"><b>${e[0]}</b><p>${e[1]}</p></div><button class="dots" onclick="go('07-exercise-detail')">編輯</button></div>`).join('');}
function editor(){headerTop('01-week','課表');const d=base[state.day];footer('檢查 3 天課表','10-plan-preview','目前為草稿','尚未套用到日期');return progress(2)+head('手動排課','點「加入動作」挑選；點編輯或長按可改組次。')+`<div class="daytabs">${base.map((d,i)=>`<button class="${state.day===i?'on':''}" onclick="state.day=${i};render()">${d.date} ${d.weekday}<br><span class="mini">${d.kind} · ${d.time}分</span></button>`).join('')}</div><div class="editor-layout"><div><div class="row between" style="margin-bottom:15px"><h2>${d.title}</h2><span class="badge">${d.time} / 40 分鐘</span></div><div class="card"><div class="phase-title"><h2>暖身</h2><button class="quiet" onclick="state.use='stretch';state.region='胸椎';go('06-pick-stretch')">＋ 加入動作</button></div>${exrows(d.warm)}</div><div class="card gap-sm"><div class="phase-title"><h2>訓練</h2><button class="quiet" onclick="state.use='strength';state.region='腿';go('05-pick-strength')">＋ 加入動作</button></div>${d.main.length?exrows(d.main):'<p class="small muted" style="padding:10px 0">這天是舒緩課，不安排肌力訓練。</p>'}</div><div class="card gap-sm"><div class="phase-title"><h2>收操</h2><button class="quiet" onclick="go('06-pick-stretch')">＋ 加入動作</button></div>${d.cool.length?exrows(d.cool):'<p class="small muted" style="padding:10px 0">本次已是舒緩拉伸，可不另加收操。</p>'}</div><button class="quiet gap-sm" onclick="toast('將這天複製到其他未有紀錄的日期')">複製這天的安排</button></div><aside class="desktop-library card"><h2>快速加入動作</h2><p class="small muted gap-sm">目前加入到 ${d.date} · 訓練</p><div class="search gap-sm">${I('search')}<input class="input" placeholder="搜尋動作或部位"></div><div class="chips gap-sm">${['腿','胸','背','前鋸肌'].map((x,i)=>chip(x,i===0,`go('05-pick-strength')`)).join('')}</div>${catalogRows(exercises.slice(0,4))}<button class="btn primary full gap" onclick="addSelected()">加入 2 個動作</button></aside></div>`;}
function catalogRows(items){return items.map(e=>`<button class="catalog-row" data-id="${e.id}" onclick="toggleExercise('${e.id}')"><span class="check ${state.selected.has(e.id)?'checked':''}">${state.selected.has(e.id)?'✓':''}</span><div class="grow"><h3>${e.name}</h3><p>${e.tags} · ${e.equip}</p></div><span class="muted">›</span></button>`).join('');}
function toggleExercise(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render();}
function addSelected(){const target=state.use==='strength'?'main':'warm';for(const id of state.selected){const e=exercises.find(x=>x.id===id);if(e&&!base[state.day][target].some(x=>x[0]===e.name))base[state.day][target].push([e.name,state.use==='strength'?'1組 × 6下':'1組 × 4次／側']);}state.selected.clear();go('04-manual');toast('動作已加入這天的草稿');}
function picker(stretch=false){if(stretch&&state.use!=='stretch'){state.use='stretch';state.region='胸椎';state.selected=new Set(['thoracic']);}if(!stretch&&state.use!=='strength'){state.use='strength';state.region='腿';state.selected=new Set(['split','goblet']);}headerTop('04-manual','回到排課');const available=exercises.filter(x=>x.group===(stretch?'stretch':'strength')&&(state.region==='全部'||x.region===state.region));footer('加入 '+Math.max(1,state.selected.size)+' 個動作','!addSelected()',`已選 ${Math.max(1,state.selected.size)} 個`,base[state.day].date+' · '+(stretch?'暖身':'訓練'));return head('加入動作',`加入到 ${base[state.day].date} ${base[state.day].weekday} · ${stretch?'暖身':'訓練'}`)+`<div class="search">${I('search')}<input id="search" class="input" placeholder="搜尋動作、腿拉伸、前鋸肌…" oninput="filterCatalog(this.value)"></div><div class="segments gap"><button class="${!stretch?'on':''}" onclick="state.use='strength';state.region='腿';go('05-pick-strength')">肌力訓練</button><button class="${stretch?'on':''}" onclick="state.use='stretch';state.region='胸椎';go('06-pick-stretch')">動態拉伸</button><button onclick="toast('切換到收操，保留已選動作')">收操放鬆</button></div><label class="label gap">${stretch?'想活動哪個區域？':'想練哪個部位？'}</label><div class="chips">${(stretch?['胸椎','肩胸','髖','腿部','踝小腿']:['全部','腿','胸','背','肩胛','核心']).map(r=>chip(r,state.region===r,`state.region='${r}';render()`)).join('')}</div>${!stretch?`<button class="details-link" onclick="state.region='肩胛';render()">細分肌群：前鋸肌、旋轉肌群… ${I('arrow')}</button>`:'<p class="small muted gap-sm">腿部拉伸包含腿前、腿後與內收肌。</p>'}<div class="row between gap"><h2>${stretch?state.region+'動態拉伸':state.region+'部肌力'}</h2><span class="small muted">${available.length} 個動作</span></div><div class="catalog-list gap-sm" id="catalog">${catalogRows(available)}</div><p class="small muted gap">勾選後按「加入」才會放入草稿；加入後仍可改組次。</p>`;}
function filterCatalog(q){document.querySelectorAll('#catalog [data-id]').forEach(el=>{const e=exercises.find(x=>x.id===el.dataset.id);el.style.display=(e.name+e.tags+e.equip).includes(q)?'flex':'none';});}
function detail(){headerTop('04-manual','回到排課');footer('儲存修改','!go("04-manual");toast("已更新這個動作的組次")');return head('編輯動作','10/19 週一 · 訓練')+`<div class="card"><span class="badge">腿後側 · 臀</span><h2 class="gap-sm">啞鈴羅馬尼亞硬舉</h2><p class="small muted gap-sm">這裡設定計畫組次；實際重量與完成紀錄在「今天」填寫。</p><div class="formrow gap"><label>組數<input class="input" type="number" value="2" min="1"></label><label>每組次數<input class="input" type="number" value="6" min="1"></label><label>組間休息（秒）<input class="input" type="number" value="90"></label><label>安排階段<select class="input"><option>訓練</option><option>暖身</option><option>收操</option></select></label></div><div class="divider"></div><button class="details-link" onclick="toast('展開動作步驟與注意事項')">動作教學與準備組 ${I('arrow')}</button></div><div class="card gap"><h3>調整順序</h3><div class="row gap-sm"><button class="btn secondary grow" onclick="toast('已往前移動一格')">↑ 往前</button><button class="btn secondary grow" onclick="toast('已往後移動一格')">↓ 往後</button></div></div><button class="quiet gap" style="color:var(--red)" onclick="go('04-manual');toast('已移除，可復原')">移除這個動作</button>`;}
function autoGoals(){headerTop('03b-dates-auto');footer('下一步：身體感受','09-auto-body');return progress(2,true)+head('這週，希望怎麼練？','先填主要條件，動作可以交給系統搭配。','自動排課 · 10/19 — 10/25')+`<label class="label">主要方向</label><div class="goals">${['均衡體能','整體肌力','協調與反應','穩定與控制'].map((x,i)=>`<button class="goal ${state.goal===i?'on':''}" onclick="state.goal=${i};render()">${state.goal===i?'✓ ':''}${x}</button>`).join('')}</div><div class="row between gap"><label class="strong">每天可用多久？</label><div class="row"><input aria-label="每日可用分鐘" class="input" style="width:78px" type="number" value="40"><span class="small">分鐘</span></div></div><p class="mini muted gap-sm">訓練日合理分配，球日與恢復日可以較短。</p><label class="label gap">這週哪幾天打羽球？</label><div class="days">${['一','二','三','四','五','六','日'].map((d,i)=>`<button class="${state.court.has(i+1)?'on':''}" onclick="state.court.has(${i+1})?state.court.delete(${i+1}):state.court.add(${i+1});render()">${d}</button>`).join('')}</div><div class="row gap-sm"><span class="small muted">每次約</span><input class="input" style="width:80px" type="number" value="90"><span class="small muted">分鐘</span><select class="input grow" aria-label="球局強度"><option>混合強度</option><option>輕鬆打</option><option>高強度</option></select></div><label class="label gap">可用器材</label><div class="chips">${['啞鈴','彈力繩','滑輪','滾筒','跳繩'].map((x,i)=>chip(x,i<3)).join('')}</div><button class="details-link gap-sm" onclick="toast('展開每週體能可用日與賽事日期')">體能可用日與比賽日期 ${I('arrow')}</button>`;}
function autoBody(){headerTop('08-auto-goals');footer('產生課表預覽','!state.mode="auto";go("10-plan-preview")');return progress(3,true)+head('開始前，身體感覺如何？','這些資訊會影響訓練與恢復安排。')+`<label class="label">目前的恢復狀態</label><div class="stack">${[['精神正常','維持一般起步安排'],['有點累','保留拉伸，減少正式訓練'],['明顯疲勞','只做舒緩活動或休息']].map((x,i)=>`<button class="radio ${state.recovery===i?'on':''}" onclick="state.recovery=${i};render()"><span class="circle"></span><span><b>${x[0]}</b><p>${x[1]}</p></span></button>`).join('')}</div><button class="details-link gap-sm" onclick="toast('展開疼痛、治療與動作限制；此條件會優先處理')">有疼痛、治療或動作限制？ ${I('arrow')}</button><div class="card gap"><h3>想加強哪裡？ <span class="small muted">選填，最多 4 項</span></h3><div class="chips gap-sm">${['前鋸肌','肩胛穩定','臀肌','核心'].map((x,i)=>chip(x,i<2)).join('')}</div><button class="details-link" onclick="toast('展開全部細分部位')">選其他部位 ${I('arrow')}</button><div class="divider"></div><label class="label">無痛、但感覺僵硬的位置</label><div class="chips">${['胸椎','髖','肩胸','踝小腿'].map((x,i)=>chip(x,i===0)).join('')}</div></div><button class="details-link gap" onclick="state.use='strength';state.region='腿';go('05-pick-strength')">想指定某些動作？ <span>已選 3 個 ›</span></button><p class="mini muted">預覽會交代手選動作是否排入，以及未排原因。</p>`;}
function planDays(imported=false){return base.map((d,i)=>`<button class="plan-day" onclick="state.day=${i};go('04-manual')"><div class="row"><span class="number">${i+1}</span><div class="grow"><h3>${imported?'第 '+(i+1)+' 天':d.date+' '+d.weekday} · ${d.title}</h3><p class="small muted gap-sm">${d.kind} · ${d.time} 分鐘 · ${i===2?'球日舒緩':'暖身 → 肌力 → 收操'}</p></div>${I('arrow')}</div></button>`).join('');}
function preview(){headerTop(state.mode==='auto'?'09-auto-body':'04-manual','返回修改');footer('套用到課表','!state.autoApplied=true;go("01-week")','3 天 · 尚未套用','確認後才更新日期安排');return progress(state.mode==='auto'?4:3,state.mode==='auto')+head('先檢查，再套用','10/19 — 10/23 · 共 3 天')+`<div class="row between"><span class="badge purple">草稿預覽</span><button class="quiet" onclick="go('11-share')">${I('share')} 分享預覽</button></div><div class="card gap"><div class="panel-title">這份課表的重點</div><h2>2 天肌力，1 天球日舒緩</h2><p class="small muted gap-sm">先做指定八段動態拉伸；肌力日保留推拉與下肢模式，球日不硬塞滿 40 分鐘。</p><div class="divider"></div><button class="details-link" onclick="toast('展開八區的實際安排日期')">拉伸 8 / 8 區已安排 ${I('arrow')}</button><button class="details-link" onclick="toast('展開手選動作與實際排入日期')">手選動作 3 / 3 已排入 ${I('arrow')}</button></div><div class="card gap">${planDays()}</div><button class="quiet gap-sm" onclick="go('04-manual')">${I('edit')} 調整某一天的動作</button><p class="mini muted gap-sm">預覽不是完成紀錄。已有訓練紀錄的日期會保留，套用前會再檢查衝突。</p>`;}
function share(){headerTop('10-plan-preview','返回課表');footer(state.shareReady?'複製分享連結':'建立分享連結',state.shareReady?'!state.linkCopied=true;toast("原型示意：連結已複製，可查看接收畫面")':'!state.shareReady=true;render()',`分享 ${state.shareDays.size} 天`,state.shareReady?'分享的是課表副本':'接收者可自行選擇套用日期');return head('分享課表','挑選要分享的天數，不必分享整週。')+`<label class="label">課表名稱</label><input class="input" value="羽球基礎・3 天課表"><div class="card gap">${base.map((d,i)=>`<button class="catalog-row" onclick="state.shareDays.has(${i})?state.shareDays.delete(${i}):state.shareDays.add(${i});render()"><span class="check ${state.shareDays.has(i)?'checked':''}">${state.shareDays.has(i)?'✓':''}</span><div class="grow"><h3>${d.date} ${d.weekday} · ${d.title}</h3><p>${d.time} 分鐘</p></div></button>`).join('')}</div><div class="soft gap"><h3>分享內容</h3><p class="small muted gap-sm">只包含所選日期的動作、組次、休息與順序。<br>不包含健康備註、實際重量或完成紀錄。</p></div>${state.shareReady?`<div class="card gap"><span class="badge green">✓ 分享連結已建立</span><div class="linkbox gap-sm">https://fitness.example/s/7Q2M</div><p class="mini muted gap-sm">拿到連結的人可檢視這份副本；接收者的修改不會影響你。</p><button class="quiet" onclick="go('12-shared-view')">查看接收者會看到的畫面 ›</button></div>`:'<p class="small muted gap">對方會看到第 1、2、3 天，並自行挑選新日期。</p>'}`;}
function shared(){headerTop(null);footer('選日期，匯入我的課表','13-import-dates');return `<div class="hero-share"><div class="kicker">朋友分享的課表</div><h1>羽球基礎・3 天課表</h1><p class="muted small gap-sm">2 天肌力 · 1 天舒緩恢復</p><div class="stats"><div><b>3</b><span>天課表</span></div><div><b>12–38</b><span>分鐘／天</span></div><div><b>3</b><span>種器材</span></div></div></div><div class="read-two gap"><div><h2>先看看內容</h2><div class="card gap-sm">${planDays(true)}</div></div><aside><div class="card gap"><h3>需要準備</h3><div class="chips gap-sm"><span class="badge">啞鈴</span><span class="badge">彈力繩</span><span class="badge">滑輪</span></div><p class="small muted gap-sm">匯入前可以更換不適合的動作。</p></div><div class="soft gap"><h3>日期由你決定</h3><p class="small muted gap-sm">這是課表副本，不會自動加入行事曆。<br>下一步可逐天選日期；修改不影響分享者。</p></div><p class="small muted gap">免登入即可預覽。匯入後可保存在這台裝置。</p></aside></div>`;}
function mapping(){headerTop('12-shared-view','返回預覽');footer('下一步：檢查日期','14-import-conflict','要匯入 3 天','每一天對應一個日期');return `<div class="subnav"><span class="current">1 選日期</span><i></i><span>2 檢查並匯入</span></div>`+head('這 3 天，要排在哪天？','左右對照確認，每一天都可以單獨修改。')+`<div class="segments"><button class="${state.dateMode===0?'on':''}" onclick="state.dateMode=0;render()">保留原本間隔</button><button class="${state.dateMode===1?'on':''}" onclick="state.dateMode=1;render()">逐天指定日期</button></div><p class="small muted gap-sm">原課表間隔 2 天；先排到下週，你仍可逐天調整。</p><div class="stack gap">${base.map((d,i)=>`<div class="map"><div class="mapped-grid"><div class="map-head"><span class="number">${i+1}</span><div><h3>第 ${i+1} 天 · ${d.title}</h3><p class="small muted">${d.time} 分鐘</p></div></div><div class="arrow">套用到 ↓</div><div><input aria-label="第 ${i+1} 天套用日期" class="input" type="date" value="2026-10-${[26,28,30][i]}">${i===1?'<p class="mini" style="color:var(--amber);margin-top:6px">此日已有未開始的課表</p>':i===2?'<p class="mini" style="color:var(--red);margin-top:6px">此日已有訓練紀錄，須改日期</p>':''}</div></div></div>`).join('')}</div><p class="small muted gap">下一步會先檢查日期，不會立刻寫入。</p>`;}
function conflicts(){headerTop('13-import-dates','返回日期');footer('重新檢查日期','!state.resolved=true;go("15-import-review")','2 天需處理','10/28 與 10/30');return head('有 2 天需要先處理','不會自動合併，也不會覆蓋你的訓練紀錄。')+`<div class="card"><span class="badge amber">第 2 天 · 日期已有課表</span><h2 class="gap-sm">10/28 已有「上肢肌力」</h2><p class="small muted gap-sm">尚未開始，沒有訓練紀錄。</p><div class="stack gap"><button class="radio ${!state.overwriting?'on':''}" onclick="state.overwriting=false;render()"><span class="circle"></span><span><b>換一個日期</b><p>保留原本的課表</p></span></button><button class="radio ${state.overwriting?'on':''}" onclick="state.overwriting=true;render()"><span class="circle"></span><span><b>替換這天的原課表</b><p>改成分享的第 2 天：肩胛與上肢肌力</p></span></button></div></div><div class="card gap" style="border-color:#dcb4ba"><span class="badge red">第 3 天 · 已有訓練紀錄</span><h2 class="gap-sm">10/30 不能覆蓋</h2><p class="small muted gap-sm">請替分享的第 3 天選另一個日期。<br>原本的課表與紀錄會保留。</p><label class="label gap">第 3 天的新日期</label><input class="input" type="date" value="2026-10-31"><p class="mini gap-sm" style="color:var(--green)">✓ 10/31 可安排，沒有日期衝突</p></div>`;}
function importReview(){headerTop('13-import-dates','修改日期');footer(state.overwriting?'確認匯入 3 天課表':'確認匯入 3 天課表','16-import-done',state.overwriting?'新增 2 天 · 替換 1 天':'新增 3 天','確認後才更新我的課表');return `<div class="subnav"><span>1 選日期</span><i></i><span class="current">2 檢查並匯入</span></div>`+head('最後確認，才會匯入','羽球基礎・3 天課表')+`<div class="card">${base.map((d,i)=>`<div class="plan-day"><div class="row between"><span class="badge gray">第 ${i+1} 天</span><span class="badge ${i===1&&state.overwriting?'amber':'green'}">${i===1&&state.overwriting?'替換原課表':'新增'}</span></div><h3 class="gap-sm">${d.title}</h3><p class="small muted gap-sm">→ 10/${[26,state.overwriting?28:29,31][i]} ${['週一',state.overwriting?'週三':'週四','週六'][i]} · ${d.time} 分鐘</p></div>`).join('')}</div>${state.overwriting?'<div class="notice gap"><b>只替換 10/28 尚未開始的課表。</b><br>10/30 已有紀錄，已改排到 10/31；原紀錄保留。</div>':''}<div class="soft gap"><div class="row between"><h3>器材已確認</h3><span style="color:var(--green)">✓</span></div><p class="small muted gap-sm">啞鈴、彈力繩、滑輪符合目前設定。</p><button class="details-link" onclick="go('05-pick-strength')">匯入前更換某個動作 ${I('arrow')}</button></div><p class="small muted gap">未登入：這份副本將儲存在目前裝置。登入後可另行同步，匯入不會把動作標成完成。</p>`;}
function done(){headerTop();footer('查看我的課表','01-week');return `<div style="text-align:center">${head('已匯入 3 天課表','你的新日期都已安排好。')}<div class="stepdone">✓</div></div><div class="card gap">${base.map((d,i)=>`<div class="done-date"><p class="strong">10/${[26,28,31][i]} · ${d.title}</p><p class="small muted">${d.time} 分鐘 · 尚未完成訓練</p></div>`).join('')}</div><div class="success gap">✓ 分享者的原課表不受影響<br>✓ 10/30 的訓練紀錄已保留</div><button class="quiet gap" onclick="toast('撤銷這次匯入，還原未有新紀錄的日期；已有新紀錄的日期會保留')">撤銷這次匯入</button><p class="small muted gap-sm">開始訓練後有新紀錄的日期，不會被撤銷覆蓋。</p><div class="card gap"><h3>需要跨裝置使用？</h3><p class="small muted gap-sm">可稍後登入並同步，不影響這次匯入。</p><button class="quiet" onclick="toast('原型示意：登入並同步')">登入並同步 ›</button></div>`;}
function render(){let el=document.getElementById('app');el.className='main';let content='';switch(current){case'01-week':content=week();break;case'02-empty':content=week(true);break;case'03-dates-manual':state.mode='manual';content=dates();break;case'03b-dates-auto':state.mode='auto';content=dates(true);break;case'04-manual':content=editor();break;case'05-pick-strength':content=picker(false);break;case'06-pick-stretch':content=picker(true);break;case'07-exercise-detail':content=detail();break;case'08-auto-goals':content=autoGoals();break;case'09-auto-body':content=autoBody();break;case'10-plan-preview':content=preview();break;case'11-share':state.shareReady=true;content=share();break;case'12-shared-view':content=shared();break;case'13-import-dates':content=mapping();break;case'14-import-conflict':content=conflicts();break;case'15-import-review':content=importReview();break;case'16-import-done':content=done();break;default:content=week();}if(!['01-week','02-empty','04-manual','12-shared-view'].includes(current))el.classList.add('narrow');el.innerHTML=content;document.body.dataset.page=current;document.title=current+'｜Fitness Planner 設計原型';}
const initial=new URL(location).searchParams.get('page');if(initial)current=initial;if(current==='06-pick-stretch'){state.use='stretch';state.region='胸椎';state.selected=new Set(['thoracic']);}render();
window.prototypePages=['01-week','02-empty','03-dates-manual','03b-dates-auto','04-manual','05-pick-strength','06-pick-stretch','07-exercise-detail','08-auto-goals','09-auto-body','10-plan-preview','11-share','12-shared-view','13-import-dates','14-import-conflict','15-import-review','16-import-done'];
</script></body></html>
