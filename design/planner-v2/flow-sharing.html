天完整畫面" loading="eager"></a></article><article class="screen"><div class="copy"><h3>接收者看到的課表</h3><p class="muted">免登入先看 N 天、內容、器材。</p></div><a href="png/12-shared-view.png"><img src="png/12-shared-view.png" alt="接收者看到的課表完整畫面" loading="eager"></a></article><article class="screen"><div class="copy"><h3>來源日對應新日期</h3><p class="muted">保留間隔或逐天指定，永遠看得見來源與目的日期。</p></div><a href="png/13-import-dates.png"><img src="png/13-import-dates.png" alt="來源日對應新日期完整畫面" loading="eager"></a></article><article class="screen"><div class="copy"><h3>處理日期衝突</h3><p class="muted">預設換日期，已有紀錄的日期不可覆蓋。</p></div><a href="png/14-import-conflict.png"><img src="png/14-import-conflict.png" alt="處理日期衝突完整畫面" loading="eager"></a></article><article class="screen"><div class="copy"><h3>確認新增</h3><p class="muted">明列確切日期；按最後確認才匯入。</p></div><a href="png/15-import-review.png"><img src="png/15-import-review.png" alt="確認新增完整畫面" loading="eager"></a></article><article class="screen"><div class="copy"><h3>完成與後續</h3><p class="muted">顯示實際目的日期；計畫匯入不等於完成訓練。</p></div><a href="png/16-import-done.png"><img src="png/16-import-done.png" alt="完成與後續完整畫面" loading="eager"></a></article></div></main></body></html>
