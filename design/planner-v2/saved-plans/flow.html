<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>命名收藏與分享課表</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172b43;font-family:'Noto Sans CJK TC',sans-serif}main{max-width:1320px;padding:36px;margin:auto}h1{font-size:28px;margin:0 0 10px}h2{font-size:19px;margin:0 0 8px}p{margin:0;font-size:14px;line-height:1.8;color:#53667c}header{border-left:5px solid #4338ca;padding-left:18px;margin-bottom:26px}a{color:#0369a1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #dce7ef;border-radius:18px;overflow:hidden}.copy{padding:18px;min-height:120px}.card img{display:block;width:100%;height:auto}.board{width:1260px}.board img{height:900px;object-fit:contain;object-position:top}.note{background:#edf7ff;padding:16px;border-radius:12px;margin-bottom:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px}}</style><body><main class="board"><header><h1>取名收藏，再分享自己的課表</h1><p>① 幫這天的課表取名　→　② 收藏在「我的課表」　→　③ 分享給別人或選日期套用</p></header><div class="grid"><article class="card"><div class="copy"><h2>幫課表取名</h2><p>保存暖身、訓練、收操及計畫組次，建立獨立副本。</p><a href="png/02-name-template.png">開啟 PNG</a></div><img src="png/02-name-template.png" alt="幫課表取名"></article><article class="card"><div class="copy"><h2>在我的課表找回</h2><p>名稱、動作數與內容類型一眼可見，重新整理後仍保留。</p><a href="png/03-my-library.png">開啟 PNG</a></div><img src="png/03-my-library.png" alt="在我的課表找回"></article><article class="card"><div class="copy"><h2>分享命名課表</h2><p>名稱與內容一起分享，建立當下的固定副本。</p><a href="png/06-share-named-template.png">開啟 PNG</a></div><img src="png/06-share-named-template.png" alt="分享命名課表"></article></div></main></body></html>
