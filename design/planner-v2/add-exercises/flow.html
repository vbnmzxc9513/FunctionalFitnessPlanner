<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加入動作的完整流程</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172b43;font-family:'Noto Sans CJK TC',sans-serif}main{max-width:1320px;padding:36px;margin:auto}h1{font-size:28px;margin:0 0 10px}h2{font-size:19px;margin:0 0 8px}p{margin:0;font-size:14px;line-height:1.8;color:#53667c}header{border-left:5px solid #4338ca;padding-left:18px;margin-bottom:26px}a{color:#0369a1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #dce7ef;border-radius:18px;overflow:hidden}.copy{padding:18px;min-height:120px}.card img{display:block;width:100%;height:auto}.board{width:1260px}.board img{height:900px;object-fit:contain;object-position:top}.note{background:#edf7ff;padding:16px;border-radius:12px;margin-bottom:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px}}</style><body><main class="board"><header><h1>加入動作：找得到、選得快、看得見結果</h1><p>① 依部位找動作　→　② 跨分類一起確認　→　③ 回到指定日期與階段</p></header><div class="grid"><article class="card"><div class="copy"><h2>從訓練加入</h2><p>先選腿、胸、背或前鋸肌，也能收藏常用動作。</p><a href="png/03-training-open.png">開啟 PNG</a></div><img src="png/03-training-open.png" alt="從訓練加入"></article><article class="card"><div class="copy"><h2>一次確認多個動作</h2><p>跨部位選擇集中檢查，可以移除或繼續選。</p><a href="png/05-selected-three.png">開啟 PNG</a></div><img src="png/05-selected-three.png" alt="一次確認多個動作"></article><article class="card"><div class="copy"><h2>回到當日課表</h2><p>直接看到指定階段新增的動作；可復原或編輯。</p><a href="png/06-added-to-day.png">開啟 PNG</a></div><img src="png/06-added-to-day.png" alt="回到當日課表"></article></div></main></body></html>
