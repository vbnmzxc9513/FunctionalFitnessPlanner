s{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{font-size:13px;min-height:44px;padding:7px 12px}.chips button[aria-pressed=true]{border-color:#5c50d7;color:#4f43c7;background:#f0eeff}.panel-body{overflow-y:auto;flex:1;padding:16px 20px;overscroll-behavior:contain}.section-label{font-size:13px;font-weight:700;color:#576c88;margin-bottom:10px}.combo{padding:14px;background:white;border:1px solid #dce5ef;border-radius:14px;margin-bottom:10px}.combo h3{margin-bottom:4px}.combo .meta{font-size:12px;color:#61738c;margin:4px 0 7px}.combo .names{font-size:13px;color:#61738c;line-height:1.6}.combo .row{margin-top:10px}.combo .add{font-size:14px;min-width:102px;color:#5144df;border-color:#d8d1fc;background:#f4f1ff}.combo .add:disabled{color:#63758e;background:#f2f5f9;border-color:#dce5ef}.combo details{font-size:13px;margin-top:6px}.combo summary{min-height:44px;align-content:center;color:#00699a;cursor:pointer}.combo ul{padding-left:20px;line-height:1.9}.panel-foot{background:white;border-top:1px solid #dce5ef;padding:12px 20px max(14px,env(safe-area-inset-bottom));flex-shrink:0}.panel-foot .primary{width:100%;margin-top:10px}.panel-status{font-size:13px;line-height:1.6;color:#3d5c79}.panel-status button{font-size:13px;min-height:44px;padding:4px 10px;margin-left:6px}.modal{border:0;border-radius:18px;width:calc(100% - 32px);max-width:460px;padding:24px;max-height:85dvh;color:#25354d}.modal::backdrop{background:#142b4f66}.modal h2{margin-bottom:12px}.modal p{line-height:1.7;font-size:14px;color:#5e718a;margin-bottom:16px}.modal input[type=text]{width:100%;border:1px solid #cbd8e7;border-radius:10px;min-height:46px;padding:10px;margin:8px 0 12px}.checkrow{display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px}.checkrow input{width:19px;height:19px;accent-color:#5144df}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.subtle{font-size:12px;line-height:1.6;color:#61738c;margin-top:8px}.edit-controls{display:flex;flex-wrap:wrap;gap:8px}.edit-controls button{font-size:14px}.modal label{font-size:14px}.save-list{max-height:240px;overflow:auto}.summary-list{font-size:14px;line-height:1.9;padding-left:20px}#results-empty{padding:20px 0}.count{font-size:12px;color:#5e718a;margin-left:8px}.menu{position:relative}.menu summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:#00699a;font-size:14px}.menu-actions{position:absolute;right:0;background:#fff;box-shadow:0 6px 20px #233b5b22;padding:8px;border-radius:12px;z-index:1;width:170px}.menu-actions button{display:block;width:100%;border:0;text-align:left;font-size:14px}@media(min-width:900px){.shell{padding-top:32px}.panel{width:520px}.footer-inner{max-width:720px}}@media(max-width:350px){.shell{padding:18px 14px 155px}.panel-head,.panel-body{padding-left:14px;padding-right:14px}h1{font-size:24px}.titleline{gap:6px}.footer{padding-left:12px;padding-right:12px}.footer button{font-size:14px;padding:10px}}

<script>
const initialCombos=[{"id":"hip-internal-rotation","name":"髖內旋活動與控制","tags":["hip","mobility","control"],"region":["hip"],"description":"有支撐的髖轉換與兩種主動內旋；在舒適範圍練控制，不用力壓膝。","items":[{"id":"bf_A15","name":"坐姿 90/90 髖轉換","phase":"訓練","dose":"1 組 × 4 下"},{"id":"bf_B16","name":"坐姿主動髖內旋","phase":"訓練","dose":"1 組 × 5 下／側"},{"id":"bf_B17","name":"俯臥屈膝主動髖內旋","phase":"訓練","dose":"1 組 × 5 下／側"}]},{"id":"foot-arch-control","name":"足弓支撐與單腳控制","tags":["foot_ankle","control"],"region":["foot_ankle"],"description":"先坐姿練足底接觸與腳趾分離，再扶物練單腳平衡；腳趾保持放鬆。","items":[{"id":"bf_B13","name":"坐姿短足／足底三點支撐","phase":"訓練","dose":"1 組 × 5 下／側"},{"id":"bf_B14","name":"坐姿腳趾分離控制","phase":"訓練","dose":"1 組 × 4 下／側"},{"id":"bf_B15","name":"扶物單腳站立（三點支撐）","phase":"訓練","dose":"1 組 × 20 秒／側"}]},{"id":"scapular-upward-rotation","name":"肩胛上旋與上舉控制","tags":["scapula","control"],"region":["scapula"],"description":"牆面前伸、前臂牆滑與徒手上舉；肩胛可自然上旋，不以夾背取代上舉控制。","items":[{"id":"bf_A07","name":"肩胛伏地挺身／牆推","phase":"訓練","dose":"1 組 × 6 下"},{"id":"bf_C12","name":"前鋸肌前臂牆滑","phase":"訓練","dose":"1 組 × 6 下"},{"id":"bf_C13","name":"徒手肩胛平面上舉","phase":"訓練","dose":"1 組 × 6 下"}]},{"id":"daily-warmup","name":"每日全身暖身","tags":["full_body","mobility","control"],"region":["full_body"],"description":"八個獨立動作，包含左右側與換位時間。Y／T 與牆推為控制練習；下犬踩跟活動腿後側與小腿，未涵蓋所有大腿區域。","items":[{"id":"bf_A16","name":"嬰兒式動態後坐","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A17","name":"偉大拉伸（動態弓步轉胸）","phase":"暖身","dose":"1 組 × 3 下／側"},{"id":"bf_A10","name":"貓牛式","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A18","name":"徒手 Y／T 肩胛控制","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A07","name":"肩胛伏地挺身／牆推","phase":"暖身","dose":"1 組 × 6 下"},{"id":"bf_A06","name":"側躺胸椎開書","phase":"暖身","dose":"1 組 × 3 下／側"},{"id":"bf_A15","name":"坐姿 90/90 髖轉換","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A19","name":"下犬式交替踩跟","phase":"暖身","dose":"1 組 × 4 下／側"}]}];
const demoPersonal={id:'personal-lower',name:'我的下肢肌力',personal:true,region:['hip'],tags:['腿','肌力','啞鈴'],description:'示例收藏，可自行命名與調整。',items:[{id:'bf_B10',name:'啞鈴高腳杯深蹲',phase:'訓練',dose:'3 組 × 8 下'},{id:'bf_B11',name:'啞鈴羅馬尼亞硬舉',phase:'訓練',dose:'3 組 × 8 下'},{id:'bf_B01',name:'分腿蹲',phase:'訓練',dose:'2 組 × 6 下／側'}]};
const key='ffp_combo_first_PROTOTYPE_v1';let draft=[],personal=[demoPersonal],undo=null,tab='combos',filter='all',query='',lastFocus=null,editedId=null;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved){draft=saved.draft||[];personal=saved.personal||[demoPersonal]}}catch{}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const combos=()=>[...personal,...initialCombos];const persist=()=>{try{localStorage.setItem(key,JSON.stringify({draft,personal}))}catch{}};
function addedCount(c){return c.items.filter(i=>!draft.some(d=>d.id===i.id)).length}
function shortcut(c){const n=addedCount(c);return `<button class="shortcut" data-combo="${esc(c.id)}" ${!n?'disabled':''}><span>${esc(c.name)}<small>${c.items.length} 個動作${!n?' · 已加入':''}</small></span><b class="plus" aria-hidden="true">${n?'＋':'✓'}</b></button>`}
function renderDay(){const pinned=[...personal.slice(-1),initialCombos.find(c=>c.id==='daily-warmup')];$('#shortcuts').innerHTML=pinned.map(shortcut).join('');$('#day-count').textContent=draft.length?`${draft.length} 個動作`:'';$('#review').disabled=!draft.length;
if(!draft.length){$('#day-list').innerHTML='<div class="empty"><span class="muted">尚未加入動作</span></div>';return}
let n=0;$('#day-list').innerHTML=['暖身','訓練','收操'].map(phase=>{const items=draft.filter(i=>i.phase===phase);if(!items.length)return '';return `<h3 class="phase-title">${phase} · ${items.length} 個動作</h3>`+items.map(i=>`<button class="exercise" data-edit="${esc(i.id)}"><span class="num">${++n}</span><span style="flex:1"><span class="name">${esc(i.name)}</span><small>${esc(i.dose)}</small></span><span class="muted" aria-hidden="true">›</span></button>`).join('')}).join('');
}
function matches(c){const names={hip:'髖 腿',ankle:'足踝 足弓 小腿',shoulder:'肩背 胸椎 前鋸肌'};const text=[c.name,c.description,...c.tags||[],...(c.region||[]).map(r=>names[r]||r),...c.items.map(i=>i.name)].join(' ').toLowerCase();return (!query||text.includes(query.toLowerCase()))&&(filter==='all'||(filter==='warmup'?c.items.some(i=>i.phase==='暖身'):(c.region||[]).includes(filter)))}
function comboCard(c){const n=addedCount(c),kept=c.items.length-n;return `<article class="combo" data-card="${esc(c.id)}"><details><summary><span class="combo-label"><strong>${esc(c.name)}</strong><small>${c.items.length} 個動作${kept?` · 已有 ${kept} 個`:''}</small></span><span class="chevron" aria-hidden="true">⌄</span></summary><p class="subtle">${esc(c.description||'我的收藏')}</p><ul>${c.items.map(i=>`<li>${esc(i.name)}<br><small>${esc(i.dose)} · ${esc(i.phase)}</small></li>`).join('')}</ul></details><button class="add" data-combo="${esc(c.id)}" aria-label="${n?`加入${esc(c.name)}，新增 ${n} 個動作`:`${esc(c.name)}已在課表`}" ${!n?'disabled':''}>${n?'＋':'✓'}</button></article>`}

function renderResults(){const scroll=$('#results').scrollTop;const opened=[...document.querySelectorAll('[data-card] details[open]')].map(d=>d.closest('[data-card]').dataset.card);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));
const visible=combos().filter(matches);if(tab==='combos'){const mine=visible.filter(c=>c.personal),built=visible.filter(c=>!c.personal);$('#results').innerHTML=(mine.length?'<h3 class="section-label">我的常用</h3>'+mine.map(comboCard).join(''):'')+(built.length?'<h3 class="section-label">內建組合</h3>'+built.map(comboCard).join(''):'')}
else {const all=new Map();for(const c of visible)for(const i of c.items)if(!query||[i.name,c.name].join(' ').includes(query))all.set(i.id,i);$('#results').innerHTML=[...all.values()].map(i=>`<article class="combo"><div class="row"><div><h3>${esc(i.name)}</h3><small>${esc(i.dose)} · ${esc(i.phase)}</small></div><button class="add" data-single="${esc(i.id)}" ${draft.some(d=>d.id===i.id)?'disabled':''}>${draft.some(d=>d.id===i.id)?'已加入':'＋ 加入'}</button></div></article>`).join('')}
if(!$('#results').innerHTML)$('#results').innerHTML='<div id="results-empty"><h3>沒有符合的內容</h3><p class="subtle">原型只收錄部分示例；不會自動以其他部位替代。</p><button data-action="clear-filter" style="margin-top:16px">清除搜尋與篩選</button></div>';
for(const id of opened){const d=document.querySelector(`[data-card="${CSS.escape(id)}"] details`);if(d)d.open=true}$('#results').scrollTop=scroll;$('#done').textContent=`完成 · ${draft.length} 個動作`;
}
function feedback(message){$('#notice button').hidden=false;$('#notice-text').textContent=message;$('#notice').hidden=false;$('#panel-status').innerHTML=`${esc(message)} <button data-action="undo">撤銷</button>`}
function add(items){const focus=document.activeElement?.dataset;const incoming=items.filter(i=>!draft.some(d=>d.id===i.id));if(!incoming.length)return;undo=structuredClone(draft);draft.push(...structuredClone(incoming));persist();renderDay();renderResults();if($('#picker').open){const row=focus?.combo?document.querySelector(`[data-card="${CSS.escape(focus.combo)}"]`):null;(row?.querySelector('button:not(:disabled)')||row?.querySelector('summary')||$('#done')).focus({preventScroll:true})}else $('#day-heading').focus({preventScroll:true});feedback(`已加入 ${incoming.length} 個動作${items.length>incoming.length?` · ${items.length-incoming.length} 個重複保留原設定`:''}`)}
function closePicker(){ $('#picker').close();$('#notice').hidden=true;lastFocus?.isConnected?lastFocus.focus():document.querySelector('[data-action="open"]').focus()}
function showModal(content){$('#modal').innerHTML=content;$('#modal').showModal()}
function saveDialog(){if(!draft.length){feedback('先加入動作，再收藏成組合。');$('#notice button').hidden=true;return}$('#notice button').hidden=false;showModal('<h2 id="modal-heading">收藏成我的組合</h2><label>組合名稱<input id="combo-name" type="text" maxlength="60" placeholder="例如：我的球前髖活動"></label><div class="save-list">'+draft.map(i=>`<label class="checkrow"><input type="checkbox" value="${esc(i.id)}" checked>${esc(i.name)}</label>`).join('')+'</div><p id="save-error" role="alert"></p><div class="modal-actions"><button data-action="close-modal">取消</button><button class="primary" data-action="confirm-save">收藏並釘選</button></div>')}
function edit(id){editedId=id;const i=draft.find(d=>d.id===id);showModal(`<h2 id="modal-heading">${esc(i.name)}</h2><label>組次摘要（原型示範）<input id="dose" type="text" value="${esc(i.dose)}"></label><p>正式版沿用數值、單位及休息時間檢核。</p><div class="edit-controls"><button data-action="move-up">往前移</button><button data-action="move-down">往後移</button><button data-action="remove">移除動作</button></div><div class="modal-actions"><button data-action="close-modal">取消</button><button class="primary" data-action="save-dose">儲存修改</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.combo){add(combos().find(c=>c.id===b.dataset.combo).items);return}if(b.dataset.single){add([combos().flatMap(c=>c.items).find(i=>i.id===b.dataset.single)]);return}if(b.dataset.tab){tab=b.dataset.tab;renderResults();return}if(b.dataset.filter){filter=b.dataset.filter;renderResults();return}if(b.dataset.edit){edit(b.dataset.edit);return}
switch(b.dataset.action){case 'open':lastFocus=b;query='';filter='all';tab='combos';$('#search').value='';renderResults();$('#picker').showModal();$('#picker [data-action="close-picker"]').focus();break;case 'close-picker':closePicker();break;case 'clear-filter':query='';filter='all';$('#search').value='';renderResults();break;case 'undo':if(undo){draft=undo;undo=null;persist();renderDay();renderResults();$('#notice').hidden=true;$('#panel-status').textContent='已撤銷'}break;case 'save':saveDialog();break;case 'close-modal':$('#modal').close();break;case 'confirm-save':{const name=$('#combo-name').value.trim();const ids=[...document.querySelectorAll('.save-list input:checked')].map(i=>i.value);if(!name||!ids.length){$('#save-error').textContent='請填名稱並至少選一個動作。';break}personal.push({id:'custom-'+Date.now(),name,personal:true,tags:[],region:[],items:structuredClone(draft.filter(i=>ids.includes(i.id)))});persist();renderDay();renderResults();$('#modal').close();$('#notice-text').textContent='已收藏並釘選';$('#notice').hidden=false;$('#notice button').hidden=true;break}case 'reset':draft=[];personal=[demoPersonal];undo=null;persist();renderDay();renderResults();$('#notice').hidden=true;break;case 'review':showModal(`<h2 id="modal-heading">確認 11/16 的安排</h2><p>${draft.length} 個動作。正式版會在此顯示預估時間、器材與限制檢核。</p><ul class="summary-list">${['暖身','訓練','收操'].filter(p=>draft.some(i=>i.phase===p)).map(p=>`<li>${p}：${draft.filter(i=>i.phase===p).length} 個動作</li>`).join('')}</ul><p style="margin-top:16px">目前是操作原型，沒有連接帳號或排課儲存服務。</p><div class="modal-actions"><button class="primary" data-action="close-modal">回到草稿</button></div>`);break;case 'save-dose':{const value=$('#dose').value.trim();if(value){draft.find(i=>i.id===editedId).dose=value;undo=null;$('#notice').hidden=true;persist();renderDay();$('#modal').close()}break}case 'remove':undo=structuredClone(draft);draft=draft.filter(i=>i.id!==editedId);persist();renderDay();$('#modal').close();feedback('已移除 1 個動作');break;case 'move-up':case 'move-down':{const index=draft.findIndex(i=>i.id===editedId),sign=b.dataset.action==='move-up'?-1:1;let target=index+sign;while(target>=0&&target<draft.length&&draft[target].phase!==draft[index].phase)target+=sign;if(target>=0&&target<draft.length){[draft[index],draft[target]]=[draft[target],draft[index]];undo=null;$('#notice').hidden=true;persist();renderDay();$('#modal').close()}break}}
});
$('#search').addEventListener('input',e=>{query=e.target.value;renderResults()});$('#picker').addEventListener('cancel',()=>{$('#notice').hidden=true});renderDay();renderResults();
</script></body></html>
