<script>
const initialCombos=[{"id":"hip-internal-rotation","name":"髖內旋活動與控制","tags":["hip","mobility","control"],"region":["hip"],"description":"有支撐的髖轉換與兩種主動內旋；在舒適範圍練控制，不用力壓膝。","items":[{"id":"bf_A15","name":"坐姿 90/90 髖轉換","phase":"訓練","dose":"1 組 × 4 下"},{"id":"bf_B16","name":"坐姿主動髖內旋","phase":"訓練","dose":"1 組 × 5 下／側"},{"id":"bf_B17","name":"俯臥屈膝主動髖內旋","phase":"訓練","dose":"1 組 × 5 下／側"}]},{"id":"foot-arch-control","name":"足弓支撐與單腳控制","tags":["foot_ankle","control"],"region":["foot_ankle"],"description":"先坐姿練足底接觸與腳趾分離，再扶物練單腳平衡；腳趾保持放鬆。","items":[{"id":"bf_B13","name":"坐姿短足／足底三點支撐","phase":"訓練","dose":"1 組 × 5 下／側"},{"id":"bf_B14","name":"坐姿腳趾分離控制","phase":"訓練","dose":"1 組 × 4 下／側"},{"id":"bf_B15","name":"扶物單腳站立（三點支撐）","phase":"訓練","dose":"1 組 × 20 秒／側"}]},{"id":"scapular-upward-rotation","name":"肩胛上旋與上舉控制","tags":["scapula","control"],"region":["scapula"],"description":"牆面前伸、前臂牆滑與徒手上舉；肩胛可自然上旋，不以夾背取代上舉控制。","items":[{"id":"bf_A07","name":"肩胛伏地挺身／牆推","phase":"訓練","dose":"1 組 × 6 下"},{"id":"bf_C12","name":"前鋸肌前臂牆滑","phase":"訓練","dose":"1 組 × 6 下"},{"id":"bf_C13","name":"徒手肩胛平面上舉","phase":"訓練","dose":"1 組 × 6 下"}]},{"id":"daily-warmup","name":"每日全身暖身","tags":["full_body","mobility","control"],"region":["full_body"],"description":"八個獨立動作，包含左右側與換位時間。Y／T 與牆推為控制練習；下犬踩跟活動腿後側與小腿，未涵蓋所有大腿區域。","items":[{"id":"bf_A16","name":"嬰兒式動態後坐","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A17","name":"偉大拉伸（動態弓步轉胸）","phase":"暖身","dose":"1 組 × 3 下／側"},{"id":"bf_A10","name":"貓牛式","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A18","name":"徒手 Y／T 肩胛控制","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A07","name":"肩胛伏地挺身／牆推","phase":"暖身","dose":"1 組 × 6 下"},{"id":"bf_A06","name":"側躺胸椎開書","phase":"暖身","dose":"1 組 × 3 下／側"},{"id":"bf_A15","name":"坐姿 90/90 髖轉換","phase":"暖身","dose":"1 組 × 4 下"},{"id":"bf_A19","name":"下犬式交替踩跟","phase":"暖身","dose":"1 組 × 4 下／側"}]}];
const demoPersonal={id:'personal-lower',name:'我的下肢肌力',personal:true,region:['hip'],tags:['腿','肌力','啞鈴'],description:'示例收藏，可自行命名與調整。',items:[{id:'bf_B10',name:'啞鈴高腳杯深蹲',phase:'訓練',dose:'3 組 × 8 下'},{id:'bf_B11',name:'啞鈴羅馬尼亞硬舉',phase:'訓練',dose:'3 組 × 8 下'},{id:'bf_B01',name:'分腿蹲',phase:'訓練',dose:'2 組 × 6 下／側'}]};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=id=>`<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;let combos=[demoPersonal,initialCombos[3],...initialCombos.slice(0,3)],selected=16,weekOffset=0,tab='combos',filter='all',query='',history=null,lastFocus=null;let days={};const state=new URLSearchParams(location.search).get('state')||'empty';if(state==='filled'||state==='picker-filled')days[16]=[...structuredClone(initialCombos[3].items),...structuredClone(demoPersonal.items)];let applied={};const names=['週一','週二','週三','週四','週五','週六','週日'],english=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];const draft=()=>days[selected]||[];function countNew(c){return c.items.filter(i=>!draft().some(d=>d.id===i.id)).length}function dateText(){return `11 月 ${selected} 日`}function dayIndex(){return ((selected-16)%7+7)%7}function renderWeek(){$('#week').innerHTML=Array.from({length:7},(_,i)=>{const date=16+i+weekOffset;return `<button class="date" data-date="${date}" aria-pressed="${date===selected}" aria-label="11月${date}日 ${names[i]}"><span class="dow">${names[i].slice(1)}</span><span class="day">${date}</span>${days[date]?.length?'<span class="dot"></span>':''}</button>`}).join('')}function renderDay(){renderWeek();$('#date-title').innerHTML=`${dateText()}<span>${names[dayIndex()]}</span>`;$('#day-label').textContent=english[dayIndex()];$('#picker-date').textContent=`${dateText()}・${names[dayIndex()]}`;$('#draft-label').textContent=applied[selected]?'已套用（原型）':'尚未套用';$('#quick-list').innerHTML=combos.slice(0,2).map((c,i)=>`<button class="quick-row" data-combo="${c.id}" aria-label="加入${esc(c.name)}，新增${countNew(c)}個動作" ${!countNew(c)?'disabled':''}><span class="quick-mark">${icon(i?'spark':'dumbbell')}</span><span class="quick-name">${esc(c.name)}<span class="mini-count">${c.items.length} 動作</span></span><span class="quick-plus">${countNew(c)?'+':'✓'}</span></button>`).join('');$('#count').textContent=draft().length?`${draft().length} 動作`:'';$('#summary-count').innerHTML=`${draft().length}<span>個動作</span>`;$('#summary-phases').textContent=draft().length?['暖身','訓練','收操'].filter(p=>draft().some(i=>i.phase===p)).map(p=>`${p} ${draft().filter(i=>i.phase===p).length}`).join('　·　'):'尚未加入動作';$('#review').disabled=!draft().length;if(!draft().length){$('#exercise-list').innerHTML=`<div class="empty"><div class="empty-art">${icon('dumbbell')}</div><strong>為這天安排一點訓練</strong><p>從常用組合開始</p></div>`;return}let n=0;$('#exercise-list').innerHTML=['暖身','訓練','收操'].map(p=>{const rows=draft().filter(i=>i.phase===p);if(!rows.length)return '';return `<h3 class="phase">${p}<span>${rows.length}</span></h3>`+rows.map(i=>`<button class="exercise" data-edit="${i.id}"><span class="number">${String(++n).padStart(2,'0')}</span><span class="exercise-info"><span class="exercise-name">${esc(i.name)}</span><span class="dose">${esc(i.dose)}</span></span>${icon('arrow')}</button>`).join('')}).join('')}
function matches(c){const txt=[c.name,...c.items.map(i=>i.name),...(c.tags||[])].join(' ');return (!query||txt.toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter==='warmup'&&c.items.some(i=>i.phase==='暖身')||filter==='hip'&&(c.region||[]).includes('hip')||filter==='foot'&&(c.region||[]).includes('foot_ankle')||filter==='shoulder'&&(c.region||[]).includes('scapula'))}function row(c){const n=countNew(c),kept=c.items.length-n;return `<article class="combo-row" data-row="${c.id}"><details><summary><span class="combo-info"><strong>${esc(c.name)}</strong><small>${c.items.length} 個動作${kept?' · 已有 '+kept+' 個':''}</small></span>${icon('arrow')}</summary><div class="combo-detail"><ul>${c.items.map(i=>`<li>${esc(i.name)}<span>${esc(i.dose)} · ${i.phase}</span></li>`).join('')}</ul></div></details><button class="combo-add" data-combo="${c.id}" aria-label="加入${esc(c.name)}，新增${n}個動作" ${!n?'disabled':''}>${n?'+':'✓'}</button></article>`}function renderResults(){const scroll=$('#results').scrollTop;const opened=[...$('#results').querySelectorAll('details[open]')].map(e=>e.closest('[data-row]').dataset.row);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));const visible=combos.filter(matches);if(tab==='combos'){$('#results').innerHTML=visible.map((c,i)=>(i===0&&c.personal?'<div class="list-label">我的常用</div>':'')+(!c.personal&&(i===0||visible[i-1].personal)?'<div class="list-label">內建組合</div>':'')+row(c)).join('')}else{const all=new Map();visible.forEach(c=>c.items.forEach(i=>{if(!query||i.name.includes(query))all.set(i.id,i)}));$('#results').innerHTML=[...all.values()].map(i=>`<article class="combo-row"><div class="combo-info"><strong>${esc(i.name)}</strong><small>${esc(i.dose)}</small></div><button class="combo-add" data-single="${i.id}" aria-label="加入${esc(i.name)}" ${draft().some(d=>d.id===i.id)?'disabled':''}>${draft().some(d=>d.id===i.id)?'✓':'+'}</button></article>`).join('')}if(!$('#results').innerHTML)$('#results').innerHTML='<p class="no-results">沒有符合的內容</p>';opened.forEach(id=>{const d=$(`[data-row="${id}"] details`);if(d)d.open=true});$('#results').scrollTop=scroll;$('#done-count').textContent=draft().length?`· ${draft().length} 個動作`:''}
function feedback(text,canUndo=true){$('#toast-text').textContent=text;$('#toast').hidden=$('#picker').open;$('#toast button').hidden=!canUndo;$('#feedback').innerHTML=esc(text)+(canUndo?'<button data-action="undo">撤銷</button>':'')}function add(items){const incoming=items.filter(i=>!draft().some(d=>d.id===i.id));if(!incoming.length)return;history={date:selected,items:structuredClone(draft())};days[selected]=[...draft(),...structuredClone(incoming)];applied[selected]=false;renderDay();renderResults();feedback(`已加入 ${incoming.length} 個動作${items.length>incoming.length?` · ${items.length-incoming.length} 個重複保留原設定`:''}`)}function openPicker(b){lastFocus=b;renderResults();$('#picker').showModal();$('#toast').hidden=true;$('#picker [data-action="close"]').focus()}function closePicker(){$('#picker').close();$('#feedback').textContent='';lastFocus?.focus({preventScroll:true})}function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function edit(id){const i=draft().find(i=>i.id===id);modal(`<p class="eyebrow">動作詳情</p><h2 id="modal-title">${esc(i.name)}</h2><p class="exercise-dose">${esc(i.dose)}</p><p>${i.phase}</p><div class="edit-actions"><button data-up="${id}">往前移</button><button data-down="${id}">往後移</button><button data-remove="${id}">移除動作</button></div><div class="modal-actions"><button class="primary" data-action="close-modal">完成</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.date){selected=Number(b.dataset.date);$('#toast').hidden=true;history=null;renderDay();return}if(b.dataset.week){weekOffset+=b.dataset.week==='next'?7:-7;weekOffset=Math.max(-14,Math.min(7,weekOffset));selected=16+weekOffset;renderDay();return}if(b.dataset.combo){add(combos.find(c=>c.id===b.dataset.combo).items);return}if(b.dataset.single){add([combos.flatMap(c=>c.items).find(i=>i.id===b.dataset.single)]);return}if(b.dataset.tab){tab=b.dataset.tab;renderResults();return}if(b.dataset.filter){filter=b.dataset.filter;renderResults();return}if(b.dataset.edit){edit(b.dataset.edit);return}if(b.dataset.remove){history={date:selected,items:structuredClone(draft())};days[selected]=draft().filter(i=>i.id!==b.dataset.remove);$('#modal').close();renderDay();feedback('已移除 1 個動作');return}if(b.dataset.up||b.dataset.down){const id=b.dataset.up||b.dataset.down,items=draft(),index=items.findIndex(i=>i.id===id),dir=b.dataset.up?-1:1,target=index+dir;if(target>=0&&target<items.length&&items[target].phase===items[index].phase){history={date:selected,items:structuredClone(items)};[items[index],items[target]]=[items[target],items[index]];renderDay()}$('#modal').close();return}switch(b.dataset.action){case'open':openPicker(b);break;case'close':closePicker();break;case'close-modal':$('#modal').close();break;case'undo':if(history&&history.date===selected){days[selected]=history.items;history=null;renderDay();renderResults();$('#toast').hidden=true;$('#feedback').textContent='已撤銷'}break;case'review':modal(`<p class="eyebrow">檢查課表</p><h2 id="modal-title">${dateText()}<span style="font-size:15px;margin-left:7px;color:#a598b8">${names[dayIndex()]}</span></h2><p>${draft().length} 個動作 · 尚未套用</p><div class="review-rows">${['暖身','訓練','收操'].filter(p=>draft().some(i=>i.phase===p)).map(p=>`<div class="review-row">${p}<span>${draft().filter(i=>i.phase===p).length} 個動作</span></div>`).join('')}</div><p style="margin-top:18px;font-size:10px">此為互動原型，套用僅改變畫面狀態。</p><div class="modal-actions"><button class="secondary" data-action="close-modal">繼續編輯</button><button class="primary" data-action="apply">套用到這天</button></div>`);break;case'apply':applied[selected]=true;$('#modal').close();renderDay();feedback('已套用到 '+dateText()+'（原型）',false);break;case'more':modal(`<h2 id="modal-title">這天的課表</h2><div class="edit-actions"><button data-action="save">收藏成組合</button><button data-action="reset">清空這天</button></div><div class="modal-actions"><button class="primary" data-action="close-modal">完成</button></div>`);break;case'reset':history={date:selected,items:structuredClone(draft())};days[selected]=[];$('#modal').close();renderDay();feedback('已清空這天');break;case'settings':modal('<h2 id="modal-title">訓練時間</h2><p>40 分鐘上限</p><div class="modal-actions"><button class="primary" data-action="close-modal">完成</button></div>');break;case'save':if(!draft().length){feedback('先加入想收藏的動作',false);$('#modal').close();break}if($('#modal').open)$('#modal').close();modal(`<h2 id="modal-title">收藏成組合</h2><label class="text-label">組合名稱<input id="save-name" maxlength="50" placeholder="為這組動作取個名字"></label><div class="save-list">${draft().map(i=>`<label><input type="checkbox" value="${i.id}" checked>${esc(i.name)}</label>`).join('')}</div><div class="modal-actions"><button class="secondary" data-action="close-modal">取消</button><button class="primary" data-action="confirm-save">收藏並釘選</button></div>`);break;case'confirm-save':{const name=$('#save-name').value.trim(),ids=[...$('#modal').querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);if(!name){$('#save-name').focus();return}if(!ids.length)return;combos.unshift({id:'personal-'+Date.now(),name,personal:true,items:structuredClone(draft().filter(i=>ids.includes(i.id)))});$('#modal').close();renderDay();feedback('已收藏並釘選',false);break}}});$('#search').addEventListener('input',e=>{query=e.target.value;renderResults()});renderDay();renderResults();if(state==='picker'||state==='picker-filled')openPicker(document.querySelector('[data-action="open"]'));
</script></body></html>
